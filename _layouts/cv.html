<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<meta property="og:title" content="{{ site.title }} — {{ site.description }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:type" content="profile">
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ site.title }}">
<meta name="twitter:description" content="{{ site.description }}">
<meta property="og:image" content="{{ '/assets/og-image.png' | relative_url }}">
<meta name="twitter:image" content="{{ '/assets/og-image.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/cv.css' | relative_url }}">
<noscript>
  <style>
    .container { visibility: visible !important; }
    li::before { content: '[*]'; position: absolute; left: 0; color: #888; }
    h2::after { content: '────────────────────────────────────────────────────────────'; flex: 1; overflow: hidden; color: #2a2a2a; }
  </style>
</noscript>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.title }}",
  "jobTitle": "{{ site.description }}",
  "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}"
}
</script>
</head>
<body>
<main class="container" data-cv="{{ site.data.cv | jsonify | xml_escape }}">
  <h1 class="cv-name">{{ site.title }}</h1>
  {{ content }}
</main>

<div id="tui-hint-badge" aria-hidden="true">[ctrl+k]</div>

<div class="tui-term" id="tui-term">
  <div class="tui-term-history" id="tui-hist"></div>
  <div class="tui-term-row">
    <span class="tui-term-ps1">{{ site.data.cv.handle }}@cv:~$</span>
    <input class="tui-term-input" id="tui-input" autocomplete="off" spellcheck="false">
  </div>
  <span class="tui-term-hint">Ctrl+K / Esc to close · type help</span>
</div>

<script type="module" src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
