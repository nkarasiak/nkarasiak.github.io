<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<style>
:root {
  --bg: #0c0c0c;
  --fg: #888888;
  --fg-bright: #d0d0d0;
  --fg-dim: #555555;
  --accent: #ffffff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
}

body {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
}

pre {
  background: transparent;
  color: #707070;
  font-family: inherit;
  font-size: 0.6rem;
  line-height: 1.35;
  overflow-x: hidden;
  margin: 0 0 1.5rem;
}

code {
  font-family: inherit;
  color: var(--fg-bright);
}

pre code {
  color: #707070;
}

h1 {
  color: var(--accent);
  font-family: inherit;
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1.2;
  margin: 0 0 0.6rem;
}

h2 {
  color: var(--fg-bright);
  font-family: inherit;
  font-size: inherit;
  font-weight: 700;
  margin: 2.5rem 0 1rem;
}

p {
  margin: 0 0 1rem;
}

strong {
  color: var(--fg-bright);
  font-weight: 700;
}

em {
  color: var(--fg-dim);
  font-style: normal;
}

a {
  color: var(--fg-bright);
  text-decoration: none;
  border-bottom: 1px solid var(--fg-dim);
}

a:hover {
  border-bottom-color: var(--fg-bright);
}

/* Job title + date stacking */
p:has(em) > strong:first-child {
  display: block;
  margin-bottom: 0.15rem;
}

ul {
  list-style: none;
  padding: 0;
  margin: 0 0 1.25rem;
}

li {
  position: relative;
  padding-left: 2.5rem;
  margin-bottom: 0.75rem;
}

li::before {
  content: '[*]';
  position: absolute;
  left: 0;
  color: var(--fg-dim);
  font-weight: 400;
}

::selection {
  background: rgba(255,255,255,0.12);
  color: var(--accent);
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: #333; }

@media (max-width: 600px) {
  body { font-size: 13px; }
  .container { padding: 1.5rem 1rem 3rem; }
  li { padding-left: 2rem; }
}

@media print {
  @page { size: A4 portrait; margin: 1.5cm; }
  html, body {
    background: #fff;
    color: #000;
    height: auto;
    overflow: visible;
  }
  body { font-size: 9pt; line-height: 1.35; }
  .container { padding: 0; max-width: none; }
  h1, h2, strong { color: #000; }
  a { color: #000; border-bottom: 1px solid #999; }
  pre { color: #666; }
  li::before { color: #999; }
}
</style>
</head>
<body>
<div class="container">
  {{ content }}
</div>
</body>
</html>
